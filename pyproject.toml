[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind except) is deliberate in this codebase: hard constraint
# 4 - every external call (data, LLM, notify, DB) must degrade
# gracefully and log, never raise into the trade loop.
ignore = ["BLE001"]
